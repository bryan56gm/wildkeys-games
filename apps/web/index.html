<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <!--
      `interactive-widget=resizes-content`: al abrirse el teclado, el navegador
      encoge la página en vez de taparla. Es lo que hace que en Android no haga
      falta compensar nada; iOS todavía la tapa, y de eso se ocupa el diálogo
      midiendo el área visible.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#278a5e" />
    <meta
      name="description"
      content="Minijuegos de identificación de fauna y flora con claves dicotómicas de WildKeys."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>WildKeys Games</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aquest joc necessita JavaScript activat.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
