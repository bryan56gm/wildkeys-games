pre-commit:
  parallel: true
  commands:
    lint-staged:
      run: pnpm exec lint-staged

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# ── Por qué aquí no hay `pre-push` ────────────────────────────────────────────
#
# **Commit y push son el carril rápido. La verificación es el carril lento, y
# corre en el CI.**
#
# Lo hubo, con `pnpm check` y `pnpm build`, y tenía su motivo escrito: este repo
# no tenía workflows, así que un cambio podía llegar a `main` —y de ahí a
# producción, que despliega sola— sin que nadie hubiera pasado tipos ni tests.
# Eso se arregló el 2026-09-23: el repo ya tiene CI y corre en los ejecutores
# propios del VPS, gratis y en paralelo. El hook era el andamio de esa ausencia.
#
# Mantenerlo tiene un coste que se paga en cada push, y un coste por push se
# convierte en pushes que se posponen: los cambios se apilan y el día que por
# fin se empuja, el fallo lleva horas enterrado. Un guardia que estorba se
# acaba saltando con `--no-verify`, y lo que se salta no protege nada.
#
# Lo que queda aquí cuesta segundos y se cobra una vez. Lo demás:
#
#   tipos, lint completo, tests, build   → CI, en cada push
#   todo junto y a mano                  → `pnpm check && pnpm build`
#
# Cuándo se empuja y cuándo se abre el PR lo decide Bryan, no un hook.
