name: CI

# Corre en los ejecutores de GitHub. Hubo una etapa con un ejecutor propio en
# el VPS, y el motivo era bueno: cuando se agotan los minutos del plan gratuito
# los checks no fallan, NO ARRANCAN, y un rojo que no significa nada enseña a
# ignorar el rojo. Entre el 14 y el 23 de septiembre de 2026 pasó una semana así.
#
# Se vuelve atrás porque el precio era la máquina donde Bryan trabaja, y porque
# el 25/09 esos ejecutores dejaron de recoger trabajo sin avisar: cinco jobs de
# otro repo estuvieron VEINTICUATRO HORAS en cola antes de darse por fallidos.
# Un ejecutor que calla es peor que una cuota que se acaba.
#
# Lo que hace viable la vuelta es el presupuesto:
# - Solo en pull_request, y SOLO con el PR listo: los borradores no gastan nada,
#   y ahí es donde se iba el grueso.
# - `paths-ignore` evita gastar en cambios de documentación.
# - `concurrency` cancela ejecuciones viejas del mismo PR.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/.env.example'

# Un PR que recibe tres pushes seguidos no necesita tres runs: el último manda.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Las imágenes de GitHub traen node, pero NO pnpm. Se habían quitado
      # porque el VPS los traía puestos; sin ellas aquí, el primer paso muere
      # con «pnpm: command not found».
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El caché que faltaba, y es el caro.
      #
      # `setup-node` con `cache: pnpm` guarda el ALMACÉN DE DEPENDENCIAS, que es
      # lo barato: instalar tarda segundos. Lo que cuesta es compilar, y eso se
      # rehacía entero en cada run. Vite deja lo suyo bajo `node_modules/.vite`.
      #
      # Medido en `wildkeys-next` el 2026-10-08: el CI completo pasa de 7 min
      # 51 s a 4 min 38 s, un 40 % menos.
      #
      # Importa más de lo que parece: a siete minutos aparece la tentación de
      # RACIONAR el CI —abrirlo en borrador para que no corra, pasar la suite a
      # mano antes de empujar— y eso cambia minutos de máquina por atención
      # humana, que es el recurso caro. La solución no es racionar: es abaratar
      # hasta que racionar no tenga sentido.
      #
      # Los dos jobs comparten clave a propósito: `check` y `build` leen el
      # mismo código, y lo que uno compile le sirve al otro.
      - name: Caché de compilación y de lint
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            packages/*/node_modules/.vite
            .eslintcache
          key: compila-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            compila-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Tipos, lint y tests
        run: pnpm check

  build:
    name: Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El caché que faltaba, y es el caro.
      #
      # `setup-node` con `cache: pnpm` guarda el ALMACÉN DE DEPENDENCIAS, que es
      # lo barato: instalar tarda segundos. Lo que cuesta es compilar, y eso se
      # rehacía entero en cada run. Vite deja lo suyo bajo `node_modules/.vite`.
      #
      # Medido en `wildkeys-next` el 2026-10-08: el CI completo pasa de 7 min
      # 51 s a 4 min 38 s, un 40 % menos.
      #
      # Importa más de lo que parece: a siete minutos aparece la tentación de
      # RACIONAR el CI —abrirlo en borrador para que no corra, pasar la suite a
      # mano antes de empujar— y eso cambia minutos de máquina por atención
      # humana, que es el recurso caro. La solución no es racionar: es abaratar
      # hasta que racionar no tenga sentido.
      #
      # Los dos jobs comparten clave a propósito: `check` y `build` leen el
      # mismo código, y lo que uno compile le sirve al otro.
      - name: Caché de compilación y de lint
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            packages/*/node_modules/.vite
            .eslintcache
          key: compila-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            compila-${{ hashFiles('pnpm-lock.yaml') }}-

      # En job propio y no encadenado a `check`: hay fallos que SOLO se ven al
      # construir —una importación que el bundler no resuelve, un activo que no
      # existe— y encadenarlo los escondería detrás de cualquier test en rojo.
      - name: Build
        run: pnpm build
