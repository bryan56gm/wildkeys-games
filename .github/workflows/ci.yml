name: CI

# Corre en un EJECUTOR PROPIO, en el VPS de Bryan. Los minutos del plan gratuito
# de GitHub se agotan y, cuando se agotan, los checks no fallan: no arrancan. El
# PR se queda en rojo sin haber ejecutado nada, y un rojo que no significa nada
# enseña a ignorar el rojo. Entre el 14 y el 23 de septiembre de 2026 pasó una
# semana entera así. Un ejecutor propio no cuesta minutos y el VPS ya está
# encendido, así que da igual cuántos proyectos haya.
#
# Vale porque este repositorio es PRIVADO: en uno público, cualquiera podría
# ejecutar código en la máquina abriendo un PR. Se gestiona con
# `personal-os/scripts/vps/runner.sh`.
#
# Solo en pull_request: el check del PR es lo que decide si algo entra, y
# repetirlo en cada push a main gasta minutos sin añadir información.
# `paths-ignore` evita gastarlos en cambios de documentación.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/.env.example'

# Un PR que recibe tres pushes seguidos no necesita tres runs: el último manda.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      # Sin `setup-node` ni `action-setup`: el VPS ya tiene node y pnpm
      # instalados, y bajarlos en cada run gasta tiempo y disco a cambio de nada.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos, lint y tests
        run: pnpm check

  build:
    name: Build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      # Sin `setup-node` ni `action-setup`: el VPS ya tiene node y pnpm
      # instalados, y bajarlos en cada run gasta tiempo y disco a cambio de nada.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # En job propio y no encadenado a `check`: hay fallos que SOLO se ven al
      # construir —una importación que el bundler no resuelve, un activo que no
      # existe— y encadenarlo los escondería detrás de cualquier test en rojo.
      - name: Build
        run: pnpm build
